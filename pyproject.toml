[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "crest-traffic"
version = "8.0.0"
description = "Constrained reconstruction and estimation of spatiotemporal traffic"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "starter*"]

[tool.setuptools.package-data]
starter = ["LICENSE"]
"src.research" = ["bundled_configs/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
